# 5b.9 CI: every push and pull request runs the full test suite with the README "Tests" command: pytest
# No API key is needed or present: tests/conftest.py sets a dummy key and blocks every real provider call
# and model download, so the suite runs offline. If a future step ever needs a key, read it from
# secrets.* in that step's env; never echo it.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python 3.14, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: No secrets committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"; exit 1
          fi
          if git grep -nIE 'sk-or-v1-[0-9a-f]{64}' -- . ; then
            echo "::error::an OpenRouter key appears in a tracked file"; exit 1
          fi
          echo "no .env tracked, no key pattern found"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests (one command, README "Tests")
        run: pytest