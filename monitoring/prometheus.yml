# Scrapes the support API (src/api.py GET /metrics). From inside Docker the host is host.docker.internal;
# running Prometheus directly on the host instead, change the target to localhost:8001.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: support-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels: {service: cloudserve-support}
